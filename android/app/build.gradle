apply plugin: 'com.android.application'

/* Resolve the RetroArch checkout. Relative paths in the retroarchDir
 * property are taken relative to the android/ directory. */
def raProp = project.property('retroarchDir').toString()
def raDir  = new File(raProp).isAbsolute() ? new File(raProp) : new File(rootDir, raProp)
if (!new File(raDir, 'pkg/android/phoenix-common/jni/Android.mk').exists())
  throw new GradleException("RetroArch checkout not found at '${raDir}'. " +
    "Set retroarchDir in gradle.properties or pass -PretroarchDir=/path/to/RetroArch.")
def raPath = raDir.absolutePath

android {
  namespace 'com.retroarch'

  compileSdkVersion 36
  buildToolsVersion '36.0.0'

  ndkVersion '29.0.14206865'

  buildFeatures {
    buildConfig true
  }

  defaultConfig {
    applicationId 'com.dinothawr'
    minSdkVersion 21
    targetSdkVersion 36
    versionCode 3
    versionName '1.2'

    buildConfigField 'boolean', 'PLAY_STORE_BUILD', 'false'

    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
    }

    externalNativeBuild {
      ndkBuild {
        arguments "-j${Runtime.runtime.availableProcessors()}",
                  "RETROARCH_DIR=${raPath}",
                  'PLAY_STORE_BUILD=1'
      }
    }
  }

  packagingOptions {
    jniLibs {
      /* The frontend dlopens the core by path from nativeLibraryDir,
       * so native libraries must be extracted on install. */
      useLegacyPackaging = true
    }
  }

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.srcDirs = ['src',
                      "${raPath}/pkg/android/phoenix/src",
                      "${raPath}/pkg/android/phoenix-common/src",
                      "${raPath}/pkg/android/play-core-stub",
                      "${raPath}/libretro-common/vfs/saf/src"]
      res.srcDirs = ['res']
      assets.srcDirs = [layout.buildDirectory.dir('staged-assets').get().asFile]
      jni.srcDirs = []
    }
  }

  externalNativeBuild {
    ndkBuild {
      path 'jni/Android.mk'
    }
  }

  lint {
    checkReleaseBuilds false
  }

  signingConfigs {
    if (project.hasProperty('RELEASE_STORE_FILE')) {
      release {
        storeFile file(RELEASE_STORE_FILE)
        storePassword RELEASE_STORE_PASSWORD
        keyAlias RELEASE_KEY_ALIAS
        keyPassword RELEASE_KEY_PASSWORD
      }
    }
  }

  buildTypes {
    if (project.hasProperty('RELEASE_STORE_FILE')) {
      release {
        signingConfig signingConfigs.release
      }
    } else {
      release {
        signingConfig signingConfigs.debug
      }
    }
  }
}

/* Stage the game data under an assets/dinothawr/ prefix so the launcher
 * can enumerate it without walking framework asset directories. */
def stageGameAssets = tasks.register('stageGameAssets', Copy) {
  from new File(rootDir, '../dinothawr')
  into layout.buildDirectory.dir('staged-assets/dinothawr')
}

tasks.named('preBuild').configure {
  dependsOn stageGameAssets
}
